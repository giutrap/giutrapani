<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fff">
  <title>BREAKING — News monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="mark">●</span><span class="brand-name">BREAKING</span></a>
    <div class="header-meta"><span class="live-dot"></span> AGGIORNAMENTO AUTOMATICO OGNI MINUTO</div>
  </header>
  <main class="container">
    <section class="controls">
      <input id="search" type="search" placeholder="Cerca tra le notizie e le testate…" aria-label="Cerca nelle notizie">
      <button id="refresh-btn">Aggiorna</button>
    </section>
    <div class="feed-head">
      <div id="status" class="status" aria-live="polite">Connessione alle fonti…</div>
      <div class="order-label">PIÙ RECENTI</div>
    </div>
    <details id="news-errors-details" class="errors-details" hidden>
      <summary>Problemi nelle fonti NEWS</summary>
      <ul id="news-errors-list"></ul>
    </details>
    <section id="articles" class="news-list" aria-live="polite"></section>
    <p id="empty-state" class="empty-state" hidden>Nessuna notizia trovata.</p>
  </main>
  <footer class="footer">BREAKING · Aggregatore di notizie da testate, agenzie e fonti informative. Ogni contenuto rimanda alla pubblicazione originale.</footer>
  <script src="app.js"></script>
</body>
</html>
