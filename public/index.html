<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>BREAKING — News monitor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/" aria-label="BREAKING home"><span class="mark">●</span><span class="brand-name">BREAKING</span></a>
    <div class="header-meta"><span class="live-dot"></span> AGGIORNAMENTO AUTOMATICO OGNI MINUTO</div>
  </header>
  <main class="container">
    <section class="controls" aria-label="Ricerca notizie">
      <input id="search" type="search" placeholder="Cerca nelle notizie…" aria-label="Cerca notizie">
      <button id="refresh-btn" type="button">Aggiorna</button>
    </section>
    <div class="feed-head">
      <div id="status" class="status" aria-live="polite">Connessione alle fonti…</div>
      <div class="order-label">PIÙ RECENTI</div>
    </div>
    <details id="errors-details" class="errors-details" hidden>
      <summary>Fonti non raggiungibili</summary><ul id="errors-list"></ul>
    </details>
    <section id="articles" class="news-list" aria-live="polite"></section>
    <p id="empty-state" class="empty-state" hidden>Nessuna notizia trovata.</p>
  </main>
  <footer class="footer">BREAKING · Aggregazione di feed RSS pubblici. L'orario è quello fornito dalla fonte; i contenuti restano sui siti degli editori.</footer>
  <script src="app.js"></script>
</body>
</html>
