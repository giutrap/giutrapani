<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff"><title>Redazione — BREAKING</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand-block">
      <a class="brand-full-logo brand-wordmark" href="/" aria-label="BreakingNEWS — Ogni Giorno"><img src="/breaking-logo.webp?v=2" alt="BreakingNEWS — Ogni Giorno" width="1200" height="400"></a>
    </div>
    <div class="header-meta-group">
      <div class="header-date-line">
        <div id="header-date" class="header-date" aria-label="Data di oggi"></div>
        <time id="header-time" class="header-time" aria-label="Ora locale"></time>
      </div>
      <div class="header-meta"><span class="live-dot"></span> AGGIORNAMENTO IN TEMPO REALE</div>
    </div>
    <a class="news-link" href="/">← TORNA A BREAKING</a>
</header>
<main class="container editorial-page"><div id="editorial-content">Caricamento del contenuto…</div></main>
<script>
(async function(){
 const root=document.getElementById('editorial-content');
 const id=new URLSearchParams(location.search).get('id');
 const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 if(!id){root.textContent='Contenuto non trovato.';return;}
 try{
  const response=await fetch('/api/redazione/public/'+encodeURIComponent(id));
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||'Contenuto non disponibile.');
  const n=data.note, date=new Date(n.published_at);
  const stamp=date.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})+' · '+date.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  const safeUrl=value=>/^https?:\/\//i.test(value||'')?value:'';
  const original=safeUrl(n.original_url);
  const links='';
  root.innerHTML='<div class="editorial-meta"><time>'+stamp+'</time><span class="news-category news-category-redazione">FOCUS</span></div><h1 class="editorial-title">'+esc(n.title)+'</h1><div class="editorial-byline">'+esc(n.source||'A cura della Redazione')+'</div>'+(n.image_url?'<img class="editorial-cover" src="'+esc(n.image_url)+'" alt="'+esc(n.title)+'">':'')+'<div class="editorial-body">'+esc(n.notes).replace(/\r?\n/g,'<br>')+'</div><div class="editorial-links">'+(original?'<p><a href="'+esc(original)+'" target="_blank" rel="noopener noreferrer">Apri la fonte originale ↗</a></p>':'')+links+'</div>';
 }catch(error){root.textContent=error.message||'Contenuto non disponibile.';}
})();
</script>
</body></html>
