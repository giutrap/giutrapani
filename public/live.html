<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#b3262d"><title>Live Blog · BreakingNEWS</title>
<link rel="stylesheet" href="/style.css">
</head>
<body class="live-blog-page">
<header class="topbar">
  <div class="brand-block">
      <a class="brand-full-logo" href="/" aria-label="BreakingNEWS — Ogni Giorno"><img src="/breaking-logo.webp" alt="BreakingNEWS — Ogni Giorno" fetchpriority="high"></a>
    </div>
    <div class="header-meta-group">
    <div class="header-date-line">
      <div id="header-date" class="header-date" aria-label="Data di oggi"></div>
      <time id="header-time" class="header-time" aria-label="Ora locale"></time>
    </div>
    <div class="header-meta"><span class="live-dot"></span> AGGIORNAMENTO IN TEMPO REALE</div>
  </div>
</header>
<main class="live-blog-shell">
<div id="live-blog-loading">Caricamento della diretta…</div>
<article id="live-blog-public" hidden>
<div class="live-blog-public-kicker"><span class="live-pill">LIVE BLOGGING</span><span id="live-blog-public-status"></span></div>
<img id="live-blog-public-cover" class="live-blog-public-cover" alt="" hidden>
<h1 id="live-blog-public-title"></h1><p id="live-blog-public-subtitle" class="live-blog-public-subtitle"></p>
<div class="live-blog-byline">A cura della Redazione · <span id="live-blog-last-update"></span></div>
<div class="live-blog-timeline"><div class="live-blog-timeline-heading">LA DIRETTA · AGGIORNAMENTI IN TEMPO REALE</div><div id="live-blog-public-updates"></div></div>
</article>
<div id="live-blog-error" hidden></div>
</main>
<footer class="footer">BREAKING · Live Blog a cura della redazione.</footer>
<script src="/live-page.js"></script>
</body></html>
